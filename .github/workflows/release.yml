name: Release
on:
  push: { branches: [main] }
  # Manual trigger. A push-only workflow has no recovery path when GitHub drops the run —
  # safe to run by hand: changesets/action is idempotent, opening or updating the version PR
  # when changesets exist and publishing only versions not already on npm.
  workflow_dispatch:
concurrency: release-${{ github.ref }}
permissions: { contents: write, pull-requests: write, id-token: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      # npm >= 11.5 is required for OIDC trusted publishing; Node 22's bundled npm predates it
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify publish landed
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/verify-published.mjs
