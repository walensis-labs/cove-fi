# Cove FI example: "coastfire"
#
# Demonstrates the COAST sentinel: contribution rungs whose `start` or `end`
# is -1 mean "no fixed date — tied to the coast-fi trigger" instead. As of
# 0.4.0, coast is the TRUE CoastFIRE expectations test: the first year each
# liquid account's current balance, grown at its own resolved rate to
# retirement_year, nets (after subtracting any mortgage still owed at
# retirement) to at least fi_multiple x retirement-year spending — i.e. the
# first year this household could stop contributing today and still reach
# full FI purely on growth by 2060. (`assumptions.coast_multiple` is 0.4-
# deprecated and read nowhere anymore.) This household saves aggressively
# enough that it triggers just 5 years in (2031), not instantly — the true
# test has to clear a much higher bar than the old trailing-spend heuristic
# did, since it's compounding against retirement-year spending three-plus
# decades out, not today's. From that point, heavy contributions stop and
# the portfolio is left to compound on its own (plus one small ongoing
# rung) all the way to full FI (25x expenses), which arrives right around
# retirement.
#
# Household: born 1992, working 2026-2059, retiring in 2060 at age 68.
# Contributions 1 and 3 below run `start = 2026, end = -1` — heavy, and
# they STOP the year coast triggers. Contribution 2 runs `start = -1,
# end = 2059` — it only STARTS once coast triggers, dialing 401k
# contributions down to "just enough to keep the employer match" instead
# of stopping entirely.
#
# Things to try changing:
#   - assumptions.retirement_year: this is the main lever on whether the
#     post-coast decades of compounding actually catch up to 25x expenses
#     by the end of the plan — push it earlier and fi_year can go null.
#     It also moves coast_year itself now: a nearer retirement_year shrinks
#     both sides of the true-CoastFIRE test (less time to grow into a
#     smaller compounded target), not just the "coast to what" side.
#   - contributions[2].pct_of_income (brokerage, the heavy pre-coast rung):
#     raise or lower it and coast_year moves — but notice how little that
#     ultimately changes the outcome; decades of post-coast compounding
#     dominate the terminal number either way.
#   - assumptions.ret: the true-CoastFIRE test projects EVERY liquid
#     account forward at its own resolved rate, so a higher assumed return
#     both grows the balance faster pre-coast and compounds it harder to
#     retirement_year — coast_year moves earlier fast.

[plan]
birth_year = 1992

[[accounts]]
name = "cash"
tax = "cash"
balance = 12000

[[accounts]]
name = "brokerage"
tax = "taxable"
balance = 18000
basis = 10000

[[accounts]]
name = "401k"
tax = "trad"
balance = 25000
rmd = true

[[accounts]]
name = "roth"
tax = "roth"
balance = 15000

[[incomes]]
name = "salary"
amount = 150000
start = 2026
end = "retirement" # ends automatically the year before assumptions.retirement_year (2060)
reduces_by_pretax = true # reserved — has no effect yet; pretax rungs already reduce the tax base automatically (see docs/SEMANTICS.md)

[[social_security]]
pia_monthly = 2400
claim_year = 2060 # delayed to align with retirement at 68
haircut = 1.0

[[expenses]]
name = "living"
amount = 50000
start = 2026
end = 2091

[[expenses]]
name = "healthcare"
amount = 6000
start = 2026
end = 2091
growth_over_inflation = 0.02

[[contributions]]
# Heavy pre-coast 401k saving — stops the year coast triggers (end = -1).
account = "401k"
start = 2026
end = -1
to_limit = true
annual_limit_key = "401k"
pretax = true
employer_match_pct = 0.04 # matched 1:1 up to this % of household gross income

[[contributions]]
# Post-coast: dial 401k down to just enough to keep the employer match
# (start = -1 — this rung is dormant until coast triggers, then runs to
# retirement).
account = "401k"
start = -1
end = 2059
amount = 6000
pretax = true
employer_match_pct = 0.04

[[contributions]]
# The main heavy-early lever: an aggressive taxable brokerage rung that
# also stops the moment coast triggers.
account = "brokerage"
start = 2026
end = -1
pct_of_income = 0.35

[assumptions]
retirement_year = 2060 # age 68
